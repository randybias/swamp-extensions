    2026.10.17.1: 36bf4978f3b5f5d20ded7cb5ac13d146cf9b4c018920931daa4f69b2c183649b
  notes:
    2026.10.17.1: 'First release, beta. Generic Azure network security group rules over Azure Resource Manager REST: get/sync, ensure_rule (idempotent converge of one rule), remove_rule, apply_rule_set (plans first; applies only with an explicit flag; refuses the whole set with zero writes on any collision or invalid rule; never deletes undeclared rules) and delete (an action). Rule comparison uses the real read-back shape (singular field beside an empty plural list). Auth as in azure-vm. Live testing was not possible in this release; every live cell is recorded as blocked, so it stays on beta.'

secret-file:
  channel: beta
  ci: true
  published:
    2026.10.17.1: 5a2170e016bf3e5aed4adeefb927456e7564448525c93117257e286136c64ab5
  notes:
    2026.10.17.1: 'First release, beta. Write a secret file onto one host over SSH from vault values delivered over stdin (literal, base64 or dotenv entries single-quoted for shell sourcing), atomically and idempotently by content, mode, owner and group; verify (read-only) and remove (an action). Owner and group are set on a staged file before an mv -T rename; a symlink or directory destination is refused. State keeps metadata and at most a keyed HMAC, never the value or a plain hash. Strict host-key pins are required. Live end to end on a VPS: 12/13 on the first build, the failing symlink cell fixed and re-run 5/5. Residual: the check-then-rename race needs a parent directory an attacker cannot write.'

ssh-host:
  channel: beta
  ci: true
  published:
    2026.10.17.1: 22a2e41c695d28d3a45066cf2c9eb247503244fbefd95e63be5760ca6d414d2c
    2026.10.17.2: 2bb3f150334c01e5ffef8a16e8ef1333e8831848bdb8a49e7192a57094274c0f
    2026.10.17.3: d027e2e13ee1702270a3a445265da276024ea6f2c975b53af64d3717895b6eaf
  notes:
    2026.10.17.1: 'First release. Run one argv vector, push bytes atomically (bytes and mode converge; symlink and directory destinations are refused; Linux mv -T), and wait for SSH host keys on any host, under a required strict or trust-on-first-use host-key policy. Every ssh exit 255 is a typed transport error; supplied host keys that do not apply to the target are refused; under trust-on-first-use a recorded key is pinned for later runs and a supplied pin must match it. exec returns exit code and output hashes by default; raw output is stored only in a sensitive resource when asked, with a bounded capture size. Security: pass the private key as a vault reference only; the swamp CLI prints literal sensitive arguments under --json (swamp-club lab 3555). Every method was run live end to end on a VPS (23 cells, including failure and injection paths). Published to stable by a manual push; later versions go to beta first.'
    2026.10.17.3: 'Additive transport hardening. exec gains an optional options object: stdin (streamed to ssh stdin, never on argv, may carry secrets), timeoutMs (ssh is killed and a typed SshError with kind timeout is raised; never a partial success) and maxOutputBytes (stdout is capped and the result sets truncated instead of throwing; stderr stays bounded by max_output_bytes and throws over it). ExecResult now also carries truncated and duration_ms. Calls without options spawn the exact same ssh argv and return the same stdout, stderr and exit code as before (proved by a byte-identical argv test); exit 255 remains a transport error and no content hash reaches argv. Beta; 2026.10.17.2 stays on stable. A throwaway container sshd round trip passed: every failure throws at caps 16, 64 and 4096, trust-on-first-use first use works at cap 64, an endless writer is truncated in under 400 ms, NUL, 4 MiB and 64 MiB stdin arrive intact, and a timeout during a stdin write raises the typed timeout. On timeout the remote command keeps running (documented); bound it with the remote''s own timeout. Vendored as one byte-identical _lib/ssh.ts.'

cephadm:
  channel: beta
  ci: true
  published:
    2026.10.17.1: cb3f5404e00b2797a65dfae6694cc9a03f2d474c734ae3f2640bf5e09f50254e
    2026.10.17.2: 470d022f326c850e15bab5485556c0c6f629f5aa9727156cd9a6bab0c078feed
  notes:
    2026.10.17.2: 'Safety fixes, beta; upgrade from 2026.10.17.1. The disk wipe guard now also refuses BIOS-boot and EFI System partitions, EFI boot-entry evidence and MBR boot code in sector 0 of any disk behind a candidate (including multipath, md, LVM and crypt stacks) unless that disk''s own serial is acknowledged, and a disk with boot code or a partition-table signature in sector 0 is no longer reported already raw; the wipe zeroes sector 0. Destructive workflows re-check their gate after approval and every destructive step depends directly, succeeded-only, on its approval and gates (swamp lab 3583); destructive methods enforce their own preconditions: filesystem delete reads the real ceph fs status shape and fails closed on an unreadable client count, OSD removal runs one joint osd ok-to-stop and refuses unless health is OK or WARN. Different inline SSH keys never share a ControlMaster. Live: the wipe guard ran 7/7 on a bare-metal host using RAM-backed test disks, with the OS disks in dry run only; the workflows ran only in scratch repos against a fake cluster; cluster cells still need three or more hosts and are blocked, so it stays on beta. Residuals: an unmounted EFI boot partition without the ESP type is unprotected when efibootmgr is missing or fails; cephadm still uses its own SSH helper rather than the shared transport.'
    2026.10.17.1: 'First release, beta. Install and operate a standalone Ceph cluster managed by cephadm on Linux hosts over SSH: host preparation, disk wiping behind a fail-closed boot and root device guard, bootstrap, daemon placement, pools, CephFS, client entities, RGW users and buckets (S3 plane signed with SigV4), maintenance, teardown and read-only verification, with 22 workflows. Live testing needs three or more hosts with free whole disks and was not possible in this release; every live cell is recorded as blocked, so it stays on beta.'

cherry-servers:
  channel: beta
  ci: true
  published:
    "2026.10.16.1": 32515d4218dc027686a09506c50794a55c2c65e06a2e21f562c101aa48a19697
    "2026.10.16.2": 4eda2a766c6443bb471a31fc111c175466f41bf5f81d758f2dfe6f56e8a97b51
    2026.10.16.3: 2d64e0af158363ffb1f5adb23061fc25483add8c9de2644f2a3a33b96ce6b5b7
  notes:
    2026.10.16.3: 'Fixes: the wait-ready and delete workflows did not work in 2026.10.16.1 or 2026.10.16.2 (they read definition inputs that were never set); upgrade to this version before using them. Every delete (server, SSH key, project) is now an action, so deleting one record no longer marks every record of a shared definition as deleted. On bare metal, wait_ready now waits until the API reports the server deployed and active, because the public IP and host keys can change during deploy; read the address from state after wait_ready, never from create. New: project delete (refuses a project that still holds servers); the create workflow takes os_partition_size, spot_market, tags, and vault key names for user data and the marker-check key. Security: pass ssh_private_key and user_data as vault references only; the swamp CLI currently prints literal sensitive arguments, including from --stdin (swamp-club lab 3555). Every method and both workflows were run live end to end on VPS and bare metal; the annually billing cycle was not.'

wireguard-mesh:
  channel: beta
  ci: true
  published:
    2026.10.17.4: f74daacaa223888d33da7a3018ca6d2beb22520f2d04f1e44a50913882eb7957
    2026.10.17.5: 298d58924a8c7e8127a067f2f33a66c87ad13934e704b1f5df1891c9dfbe60dd
  notes:
    2026.10.17.4: 'First release, beta. Render one node''s WireGuard config from mesh inputs (peers allowlist, relay exclusion) and push it over SSH under a strict or persisted trust-on-first-use host-key policy. Every apply arms a host-side rollback before any live change, confirms over a fresh management connection, and disarms only its own generation under a host lock; Address or routed AllowedIPs changes recreate the interface. Live end to end on two throwaway VPS: 19 of 21 cells pass, 0 fail; a delete that severs its own management path and that delete''s rollback firing were not exercised, so it stays on beta.'
    2026.10.17.5: 'Security fix, beta; upgrade from 2026.10.17.4 with no edits. The SSH push now uses the shared ssh-host transport: host-key pins are authoritative, exit 255 is a typed transport error, and no content hash appears on any command line. host_key_policy is strict or insecure_tofu (accept-new is read as insecure_tofu; insecure is refused). Trust-on-first-use pins are now kept per node, host and port, so a run against another host or port can no longer overwrite a pin; a 2026.10.17.4 per-node pin is migrated to its endpoint on first use and its old record is left in data. Live end to end on two throwaway VPS, upgrading from the published 2026.10.17.4: 12 of 12 cells pass (pins migrated, strict, armed revert, wrong pin refused, separate pins per port, no private key or its hash on any argv, delete). Residuals: runs take about 15 to 20 s instead of about 6 s; delete leaves .wg0.epoch and .wg0.lock in /etc/wireguard; a host written with different capitalization fails closed, and different spellings of one IPv6 address or a trailing-dot name get separate pins.'

k8s-secret:
  channel: beta
  ci: true
  published:
    2026.10.17.1: 7ec9b9521c2c31d070ca6991cd19eb276a3216e820624ea306bd09e345ab2d1b
  notes:
    2026.10.17.1: 'First release, beta. Create, read, sync and delete a Kubernetes Secret from vault references, including whole-secret data_from_vault; values reach kubectl only on stdin and are never returned, and output and stored state carry metadata and key names only. Server-side apply prunes keys this model previously owned. A YAML merge-key path that could smuggle extra keys into the manifest is closed. Live end to end on a throwaway cluster: 14 of 14 cells pass, plus the data_from_vault cells.'

k0s-cluster:
  channel: beta
  ci: true
  published:
    2026.10.17.1: 617b23132f64784a82a0abd0a75e0627eddff67b1bce7d4de8570de51c88635b
    2026.10.17.2: 296d3778ee0d426019e9bf347f711994521fb046113cc3f81d84aa4fee879418
  notes:
    2026.10.17.1: 'First release, beta. Install, upgrade and reset a single-node, SHA-pinned k0s cluster on a Linux host over SSH, with a rendered k0s.yaml, readiness waits, kubeconfig capture, manifest stacks and Helm reconciliation. Every live cell passes on a throwaway host, including role migration, no control-plane taint in single mode, Helm, api_address and reset. Known residue: reset leaves /etc/k0s/containerd* and the k0s binary on the host.'
    2026.10.17.2: 'Fix release, beta; upgrade from 2026.10.17.1. reset now also removes /etc/k0s and the k0s binary it installed (only the binary at the fixed path whose SHA-256 still matches what install recorded; a foreign binary is left in place and reported), works on a unit that is already stopped after a crash or reboot, refuses a unit state it cannot classify, and keeps cleanup pending across a failed step so a rerun finishes it. State now also records binary_removed and its reason (optional fields; the change is additive). Live end to end on a throwaway VPS: 6 of 6 reset cells on the first build, then the stopped-unit failure found there fixed and re-run 3 of 3. Residual: reset still runs a foreign k0s binary for stop and reset; /etc/k0s is removed wholesale, including the operator''s own drop-ins (the README warns); a hash-then-remove race on the binary.'

server-host:
  channel: beta
  ci: true
  published:
    2026.10.17.1: c83486edf44844afae336c57dc1273dc250985d352fecf82be84664e01e8894d
    2026.10.17.3: 60d0113fce5f2d5cbffadb0cab068087ff16fd4d742e999545cfddda08854f3c
  notes:
    2026.10.17.1: 'First release, beta. Baseline hardening of a Linux server over SSH: an admin user, sshd lockdown and an nftables policy, each applied behind an armed host-side revert that fires unless a fresh management connection confirms the change. Live end to end on a throwaway VPS: 19 of 21 cells pass, then a 12 of 12 re-run on the fixes; open follow-ups are recorded in the LOGBOOK, so it stays on beta.'
    2026.10.17.3: 'New: trusted_interfaces (names or prefix* patterns) accepted in the input and forward chains, so a k0s node''s pods (kube-bridge) are not cut off by the drop policies; an entry matching the uplink, the default route or the SSH session interface is refused before anything is armed. apply_firewall refuses to replace a management-only SSH rule with an open one unless allow_widening_ssh_exposure is set, and an identical live ruleset is a no-op. Records carry an optional identity (the provider server id) and refuse another machine''s record; the new forget action empties the records of a machine that is gone. 2026.10.17.2 was never published. Live end to end in the server stack: a fresh uninterrupted run, an adopt re-run with public SSH never reopened (0 of 57 probes) and teardown twice, 8 of 8. Residuals (forget idempotency and identity checks, records without an identity adopted silently, an ssh_port change can bypass the widening guard) are in the LOGBOOK, so it stays on beta.'

redfish:
  channel: beta
  ci: true
  published:
    2026.10.17.1: 72438164e802ae182df22a25d5739d8468101dfc593c5890161cb19eaa4a4043
  notes:
    2026.10.17.1: 'First release, beta. Read and control one ComputerSystem over DMTF Redfish: get/sync (read-only), power (On, the off actions and restarts, validated against the BMC''s allowed reset types, a no-op when already there, polled to a bounded deadline) and set_boot (If-Match, read back). Vault-wired credentials travel only in a header; TLS is strict only, with ca_pem as an additional trusted CA; auth auto discovers a SessionService anonymously and falls back to Basic. Live end to end against the sushy-tools emulator only, no real BMC: 21 of 23 cells pass, 0 fail; two set_boot cells are blocked by an emulator limitation that the model correctly refuses. Residual: a 5xx during session discovery is treated as no SessionService.'

syncthing-peer:
  channel: beta
  ci: true
  published:
    2026.10.17.1: abb4df5af6f0919cd9866a4d9f444a5038ad2cf02bf780c6825c4510d64f621a
  notes:
    2026.10.17.1: 'First release, beta. Ensure a peer device and a shared folder on one Syncthing node through its REST API, reached locally or over SSH, and inspect or remove them; existing entries are updated with PATCH so fields the model does not manage survive, and repeats are no-ops. The API key is a vault reference that travels only in the X-API-Key header (over SSH, inside a curl config uploaded over stdin into a 0700 directory and removed in the same shell); plain HTTP is loopback-only and requests are bounded by timeout_s. sync records a node unreachable only for a connect, DNS or timeout failure. Live end to end on two VPS nodes with Syncthing 1.27.2: 10/10 cells, including a real file sync, a stalled API, a wrong key and an argv scan with 0 secret hits. Residual: curl''s stderr is cut to its last line in errors; no spec yet.'

host-net:
  channel: beta
  ci: true
  published:
    2026.10.17.1: 4f6b79250812d7126a891444b11c1daaa13cd2a7bfdf1532d327da83ec067cbf
  notes:
    2026.10.17.1: 'First release, beta. Configure Linux host networking over SSH with netplan: a Linux or OVS bridge, VLANs and jumbo MTU, every change under a revert armed on the host before anything is touched and cancelled only by commit after a fresh-connection check. The arm records the management path actually in use and the restore passes only if that path is back (checks retried for up to 30 s while the link re-settles); a failed restore blocks later applies until clear_failed_revert, which refuses unless the checks pass now. revert_now fires the revert early as a detached transient unit. Host keys are strict only; the SSH key is a vault reference. A netplan generate precheck over a copy of the live config runs before arming, and a VLAN MTU above its link''s MTU is refused. Live end to end on one bare-metal Ubuntu 24.04 host: the final head passed 10 of 10 cells (revert_now three times, apply and commit, revert by expiry, no schema warning), after earlier per-head matrices covering bridges, MTU, remove, refusals and precheck cleanup; the IPv6 management path is blocked (no global IPv6 on the host). Residual: in revert_now a failed SSH connect surfaces as the 120 s timeout, and the 120 s bound is not enforced during an in-flight SSH call; a crash between the restore''s marker removal and its result write leaves neither; the arm refuses a source address on lo or another NIC and a link-local management address; apply and remove run their forward netplan apply in-session, covered by the armed revert. Also, the swamp CLI prints literal sensitive arguments (swamp-club lab 3555), so pass the key as a vault reference.'

libvirt:
  channel: beta
  ci: true
  published:
    2026.10.17.1: 4e9eb385d28a61f2aac6a6a7ca5cc54cc7e4298537ed5f1d86d00ae4c1f9cf94
  notes:
    2026.10.17.1: 'First release, beta. Manage libvirt/KVM over SSH with virsh: define and undefine virtual networks (including the default), clone a golden volume per node, define domains that boot from the clone with optional data disks and a seed ISO, control power, and capture the serial console under a hard timeout into a sensitive resource (only its byte count and SHA-256 are returned). Disks render as type=''file'' so stock Ubuntu AppArmor allows them, and domains carry ACPI so shutdown works. undefine_domain with remove_volumes deletes only the recorded root volume (data disks are detached and kept; read-only media kept unless remove_attached_media), and refuses before any destroy when the record is missing, the root is not attached or the recorded uuid differs. Host keys are strict only; the SSH key is a vault reference. Live end to end on one bare-metal Ubuntu 24.04 host with libvirt 10.0: 15 of 15 cells on the final head, including the four that failed on the first live run (start on a stock host, shutdown, console on a running and on a shut-off domain) and the golden-image flow; the first run passed 37 of 41 cells covering networks, volumes, power, injection and transport refusals and a cloud-init seed boot. Residual: virsh define --validate is not used (renders are checked with virt-xml-validate in tests when present); a detach failure during undefine with remove_volumes leaves the guest destroyed and partly detached; define_domain records the named volume as the root whenever it is attached, so name the real boot volume. Also, the swamp CLI prints literal sensitive arguments (swamp-club lab 3555), so pass the key as a vault reference.'
zfs:
  channel: beta
  ci: true
  published:
    2026.10.17.1: 1507ce5570b9b91a4ca8de579e90152a55aa34071df80cd450cd0e545d7d64e5
  notes:
    2026.10.17.1: 'First release, beta. Manage a ZFS pool on a Linux host over SSH: create_pool (by-id or kernel vdev names; a re-run with the same vdevs is a no-op), datasets with allowlisted properties, sparse zvols, snapshots, clones, rollback (refuses when later snapshots exist unless destroy_later_snapshots), destroy, destroy_pool and export_pool, get and sync. create_pool runs the shared boot-disk guard on every candidate and refuses any device that carries the running or bootable system (whole boot disk, BIOS-boot or EFI partition, root md member or array). destroy_pool and export_pool refuse, regardless of recursive or force, a pool with bootfs set, a system mount (/, /boot, /boot/efi, /usr, /var, /var/lib, /var/log) backed by one of its datasets or zvols (including through dm, LVM or dm-crypt), or swap backed by it; every probe failure refuses. Host keys are strict only; the SSH key is a vault reference. Live end to end on one bare-metal Ubuntu 24.04 host with OpenZFS 2.2.2 and md root: 11 of 11 cells on the final head with the stock swap file on, including the system-pool refusals; earlier runs covered guard refusals, datasets, zvols, snapshots, clones, rollback, get/sync, destroy, injection and transport refusals (59 of 61 cells, both failures fixed). Residual: no pool import method and no mountpoint property on create_dataset; only the listed system mount paths are protected, so a pool mounted at /var/lib/docker or /home is not refused; a pool zvol with no /dev/zvol link (volmode=none) makes destroy_pool and export_pool refuse; the guard costs one ssh round trip per zvol. Also, the swamp CLI prints literal sensitive arguments (swamp-club lab 3555), so pass the key as a vault reference.'

server-stack:
  channel: beta
  ci: true
  published:
    2026.10.17.3: e58bc1370170bb19f7fb1fe289c81c219bc24b1856211b8df7c880ba7a228940
    2026.10.17.4: 4bf1c1c1199fd4f54eb71be98b84ae92bda319c4444cf3fe2e417541673e5f5d
  notes:
    2026.10.17.3: 'First release, beta. Two workflows that provision and tear down a hardened single-node k0s host on a WireGuard mesh, running NATS on the mesh address and published in Cloudflare DNS, by composing cherry-servers, ssh-host, wireguard-mesh, server-host, k0s-cluster and k8s-secret. Every destructive step depends directly, succeeded-only, on every safety gate that protects it; provision refuses an existing server or record unless adopt is set, and an adopt re-run orders nothing new, never reopens public SSH and leaves the firewall as is; teardown checks the ownership tag and record marker, forgets the server-host records and is re-runnable. Secrets are read from the server-stack vault by key name. Live end to end on throwaway Cherry VPS hosts with Cloudflare DNS: a fresh uninterrupted run, an adopt re-run (0 of 57 public SSH probes open) and teardown twice with provider counts restored, 8 of 8, after two earlier runs whose failures were fixed. Residuals are in the LOGBOOK: DNS checks read only the first A record, a bare known_hosts key line pins every address, teardown''s project_id is unused, and a wedged NATS Helm release needs a documented manual recovery.'
    2026.10.17.4: 'Feature release, beta; upgrade from 2026.10.17.3, new inputs are optional. A bounded wait-mesh step (mesh_handshake_wait_s, default 60) waits for the first WireGuard handshake before check-mesh, which stays the gate. Optional NATS token auth: nats_auth_token_key names a server-stack vault key; the token shape is checked first (16-256 characters from A-Z a-z 0-9 . _ ~ + = -), it is written as a Secret on the host through k0s-cluster apply_manifests (the control host cannot reach the Kubernetes API), the chart reads it through the README values, and the probe requires an authenticated session and a refused anonymous one. The token travels by environment and vault only, never argv. nats_chart.namespace must be DNS-1123 and, with auth on, listed in cluster_namespaces. Live end to end on a fresh throwaway host with auth on: 13 of 15, one failure fixed in this release, the other in k0s-cluster. Teardown needs k0s-cluster 2026.10.17.3: on 2026.10.17.2 reset-k0s fails and the server is not deleted. Residuals are in the LOGBOOK: no TLS or token rotation, and the wait-mesh give-up path was tested offline only.'

apt-cache:
  channel: beta
  ci: true
  published:
    2026.10.17.1: d54ce88bc97c7153a57268d98a4e3a0701765ca57170ada8ffeddbbd903c983e
  notes:
    2026.10.17.1: 'First release, beta. Install Apt-Cacher NG on one Linux host over SSH and point apt clients at it: one managed config fragment plus per-distribution backend files, a required HTTPS policy (direct, passthrough or https_backends), an optional AdminAuth credential from the vault, client proxy configuration with an optional direct fallback, hit/miss and byte statistics from the request log, and removal that restores the package''s own files and keeps the cache unless purge_cache_ack is set. install_server refreshes the package lists and keeps the first start on loopback, so the default wildcard listener is never exposed; apply verifies the exact listen addresses, a local fetch and the admin probe (401 with a credential, 200 after it is dropped). Live end to end on a throwaway Ubuntu 24.04 VPS: 9 of 10 at the first head (install on a stock image fixed since), then 7 of 7 and 5 of 5, with no wildcard listener in 554 samples during install and 0 credential hits on argv. Residuals are in the LOGBOOK: proxy-style security.ubuntu.com goes upstream over :80 uncached, debian-security is refused by design, bytes_from_cache follows apt-cacher-ng''s own formula, and the install can upgrade a shared library.'

kubevirt:
  channel: beta
  ci: true
  published:
    2026.10.17.1: 274d5c5d2588eccadb6d7c97a082ec94f05755fc3170c886db1c4e4086893316
  notes:
    2026.10.17.1: 'First release, beta. Install, upgrade and uninstall KubeVirt (and optionally CDI) on an existing Kubernetes cluster from a required SHA-256-pinned operator manifest, wait for the CR to be Deployed and Available, and define, start, stop, restart, inspect and delete one VirtualMachine from a digest-pinned containerDisk image or a CDI DataVolume template. The kubeconfig is a vault reference, validated default-deny (no exec or auth-provider plugin), written to a 0600 temporary file for one kubectl call and removed in a finally; it never reaches a command line, stored state or output. An install re-run applies the CR only when a managed field differs, delete and uninstall are clean no-ops when absent, and uninstall needs the cluster fingerprint as confirm. Live end to end on a single-node k0s v1.36.4 cluster with KubeVirt v1.9.1 and CDI v1.66.1: 23 of 24 cells, then 9 of 9 on the fixes, with immediate install re-runs as true no-ops. Node prerequisites found live (the /dev/kvm mode and k0s''s kubelet root) are in the README. Residuals are in the LOGBOOK: DataVolume VMs were not run live (no default StorageClass), the cluster fingerprint is the server URL only, and CDI ownership of a partial install is inferred from field managers.'

ubuntu-autoinstall:
  channel: beta
  ci: true
  published:
    2026.10.17.1: de4aedc1a536a6ccabfa377a29a54b2f400e0f951671b5ff6bfbe082a07c1d4d
  notes:
    2026.10.17.1: 'First release, beta. Render and validate an Ubuntu Server autoinstall NoCloud seed from typed inputs (identity, guided or explicit curtin storage including a RAID1+LVM preset, netplan network, packages and argv late-commands), then publish it over SSH into an artifact-server bundle and set a ref, or hand the files to the CIDATA builder (@evrardjp/cloud-init-nocloud). The password is a vault crypt(3) hash, never a plaintext; a LUKS passphrase is refused because autoinstall serves it in plaintext. Host keys are strict only. The rendered user-data is re-parsed with a YAML 1.1 loader and deep-compared, validated against cloud-init''s vendored 26.1 cloud-config schema and our own structural checks (subiquity''s AGPL-3.0 schema is not shipped; an optional dev test fetches it and cross-checks). Live end to end: 11 of 11 cells on the final head, a real unattended install of the official 24.04.5 live-server ISO (sha-verified) in a KVM guest with the lvm profile, seeded through publish_http, rebooted and SSH-verified, plus validate, get, sync, unpublish and plaintext-password refusals; the extension bundles in a fresh repo without its lock. Residual: the CIDATA path was not live-tested; the guest was created with virt-install (the libvirt extension has no direct-kernel boot); an unpublish without a ref treats a bundle with no meta-data as absent.'

knot-dns:
  channel: beta
  ci: true
  published:
    2026.10.17.1: 36e2012c3e40544fd847350d49347d8c3b7f958b67cbfce9f35017f62cf05a43
  notes:
    2026.10.17.1: 'First release, beta. Manage authoritative Knot DNS zones and a Knot Resolver 6 recursive resolver over SSH. Each zone is a whole-file declaration in its own config fragment (DDNS refused), rendered deterministically and checked with kzonecheck and knotc conf-check before an atomic swap; listen changes restart knotd under a host lock, every listen address is proven with kdig, and a failure restores the backup. DNSSEC signing with KSK submission and DS read-back, TSIG transfers and NOTIFY secondaries as configuration. install brings knot, knot-dnsutils and knot-dnssecutils from the archive and, for the resolver, Knot Resolver 6 from the CZ.NIC repository with a pinned, independently confirmed signing-key fingerprint, pinned at apt priority 100 so Knot DNS keeps the archive version; the resolver config is validated by kresctl and proven with a test query on a name the upstream serves. The SSH key and TSIG secrets are vault references that reach the host over stdin; host keys are strict only. Outcomes are persisted as records. Live end to end on a fresh Ubuntu 24.04 VPS, loopback only: 11/13 on the first head, then 13/13 on the fixes from a clean baseline, with 0 secret hits in an argv scan. Residuals: KASP keys are not purged on remove (use keymgr); parent_ds_check is accepted but not rendered; the resolver install''s curl dependency can upgrade curl and libcurl; a resolver test query on an address excluded by allow_query_from is refused and the apply rolls back.'
