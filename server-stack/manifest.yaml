manifestVersion: 1
name: "@randybias/server-stack"
version: "2026.10.17.5"
description: "Provision and tear down a hardened single-node k0s host on a WireGuard mesh, running NATS and published in Cloudflare DNS, by composing the server, SSH, mesh, hardening, cluster and secret model types. Workflows only: the package ships no models of its own, and every instance value arrives as a workflow input."
license: Apache-2.0
repository: https://github.com/randybias/swamp-extensions
platforms: [darwin-aarch64, darwin-x86_64, linux-x86_64, linux-aarch64]
labels: [
  k0s,
  kubernetes,
  nats,
  wireguard,
  firewall,
  cloudflare,
  orchestration,
  workflow,
]
additionalFiles: [README.md, LICENSE.txt]
models: []
workflows:
  - server-stack-provision-host/workflow.yaml
  - server-stack-teardown-host/workflow.yaml
