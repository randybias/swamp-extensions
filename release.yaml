kea-dhcp:
  channel: beta
  ci: true
  published:
    2026.10.17.1: c6e3b02ddac539ee6e10ad4b85e4ec87577e24c276821dcca5b934ce8eeae517
  notes:
    2026.10.17.1: 'First release, beta. Install and configure an ISC Kea DHCPv4 server (distro Kea 2.4) on one Linux host over SSH as root, with subnets, pools, reservations and typed options; every change is checked by kea-dhcp4 -t, written atomically and applied with config-set under an armed host-side revert that restores the previous config unless commit is called, and remove runs the same arm/verify/commit protocol. Leases come from the memfile CSV by default (lease_cmds hook opt-in); classless-static-route is out of scope. Live end to end on a throwaway VPS inside a veth lab with 0 DHCP packets on the real NICs: 11 of 11 cells pass (install, render, apply and commit with a client lease, leases, an uncommitted apply reverting, no-op re-apply, Kea-invalid config refused, SSH interface refused, get/sync without false drift, remove and commit, no private key on any argv). Residuals are in the LOGBOOK: a malformed active.json reads as no revert armed, commit''s failure gates lack unit tests, a no-op apply records an empty token, the timer fires about 35 s late, the restored stock config is root:_kea 0640, and a restore lock wait over about 35 s clears the revert without reverting (fails loud).'

# Release policy per extension. Lives outside every extension dir so it never
# changes an archive's contentHash.
#   channel: beta until a live run passes; then stable
#   ci:      false until the first push; then true
#   published: version -> contentHash, recorded with every push; a published
#              version may only be re-gated with exactly that hash
artifact-server:
  channel: beta
  ci: true
  published:
    2026.10.17.1: 198f765c88ce5f849cdb8403e1973628e605b347f292182f5ff68dd1e3966530
  notes:
    2026.10.17.1: 'First release, beta. Serve a directory of pinned artifacts over HTTP(S) from one host with nginx and manage it over SSH: render_config, install, get/sync and uninstall; upload, a host-side pinned fetch, publish_bundle, ref, unref and list; verify, plan_prune and prune. Objects are SHA-256 addressed (sha256/<hash>/<name>, bundles/<tree-hash>/) with a SHA256SUMS index, and verify re-hashes the bytes on the host. install never lets the package default site come up (a blocking policy-rc.d during apt-get), proves the config with nginx -t, enables and starts nginx, fails on any unexpected wildcard listener, and rolls every change back on any failure. Strict host-key pins only; secrets are vault references delivered over stdin. Live end to end on a throwaway Ubuntu 24.04 VPS over three rounds: 12 of 12 on the first build (two Highs found and fixed), 5 of 6 on the second (nginx left disabled, fixed), and 5 of 5 on this release including a real reboot, with no wildcard listener in 860 samples. Inline uploads are capped at 128 MiB because swamp holds the payload in memory; use fetch for larger files. Residuals are in the LOGBOOK: bundles/ itself as a symlink yields an empty prune plan rather than a refusal, purging nginx leaves the enable link install''s systemctl enable created, and the stored default-site flag can restore a default site the operator removed after a first uninstall.'

azure-vm:
  channel: beta
  ci: true
  published:
    2026.10.17.1: a33456c899d2a3e182e44da27e5998f72c877b9751c6b7c8f3abb4aa2de0f9d0
  notes:
    2026.10.17.2: 'Security fix, beta. upload no longer sends the expected SHA-256 of the content to the remote host (it appeared on the local ssh command line and the remote command, where a process listing could expose a hash of secret content); the remote now prints the destination file''s own hash and mode after the atomic rename and the comparison runs locally. Upgrade if you upload secrets. The upload cells are being re-run live on this version before it moves to stable; all other behaviour is unchanged from 2026.10.17.1.'
    2026.10.17.1: 'First release, beta. Generic Azure virtual machine lifecycle over Azure Resource Manager REST: create (adopts an existing VM, never a second), get/sync, start, stop, deallocate (real deallocation, optional hibernate) and delete (an action; deleting an absent VM is a no-op), with long-running operations polled. Auth is a service principal from the vault via OAuth2 client credentials; the secret travels only in the token request body and the token is held in memory per call; there is no az CLI path. SSH public-key admin only. Live testing was not possible in this release (no throwaway Azure subscription); every live cell is recorded as blocked, so it stays on beta.'

azure-nsg:
  channel: beta
  ci: true
