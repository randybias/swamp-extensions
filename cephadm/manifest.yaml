manifestVersion: 1
name: "@randybias/cephadm"
version: "2026.10.17.3"
description: "Install and operate a standalone Ceph cluster managed by cephadm on Debian-family Linux hosts reached over SSH. One model type drives host preparation, disk wiping, bootstrap, daemon placement, pools, CephFS, RGW users and buckets, maintenance and teardown."
license: Apache-2.0
repository: https://github.com/randybias/swamp-extensions
platforms: [darwin-aarch64, darwin-x86_64, linux-x86_64, linux-aarch64]
labels: [ceph, cephadm, storage, cluster, ssh, debian, infrastructure]
additionalFiles: [README.md, LICENSE.txt]
models:
  - cephadm.ts
workflows:
  - cephadm-add-host/workflow.yaml
  - cephadm-apply-mds/workflow.yaml
  - cephadm-apply-mgr/workflow.yaml
  - cephadm-apply-mon/workflow.yaml
  - cephadm-apply-osds/workflow.yaml
  - cephadm-bootstrap-cluster/workflow.yaml
  - cephadm-create-csi-user/workflow.yaml
  - cephadm-create-fs/workflow.yaml
  - cephadm-create-pool/workflow.yaml
  - cephadm-delete-fs/workflow.yaml
  - cephadm-distribute-key/workflow.yaml
  - cephadm-fetch-csi-key/workflow.yaml
  - cephadm-get-conn-bundle/workflow.yaml
  - cephadm-inventory-rgw-buckets/workflow.yaml
  - cephadm-prep-host/workflow.yaml
  - cephadm-remove-osds/workflow.yaml
  - cephadm-verify-health/workflow.yaml
  - cephadm-verify-host-prep/workflow.yaml
  - cephadm-verify-mgr/workflow.yaml
  - cephadm-verify-mon-quorum/workflow.yaml
  - cephadm-verify-osds/workflow.yaml
  - cephadm-wipe-disks/workflow.yaml
