id: a58154c3-a7f6-47ab-a507-05f5356f98f2
name: "@randybias/cephadm-get-conn-bundle"
description: Capture the cluster's non-secret client connection facts
version: 1
inputs:
  properties:
    host:
      type: string
      description: Admin host, hostname or IPv4
    port:
      type: integer
      description: SSH port on the admin host
    sshUser:
      type: string
      description: SSH login user on the admin host
    keyPath:
      type: string
      default: ""
      description: Absolute local path to a private key; empty uses the runner default
    host_key_policy:
      type: string
      enum: ["strict", "insecure_tofu"]
      description: Host-key policy; strict requires host_keys
    host_keys:
      type: array
      items:
        type: string
      default: []
      description: ssh-keyscan host keys, each naming its host; required for strict
  required:
    - host
    - port
    - sshUser
    - host_key_policy
jobs:
  - name: capture
    description: Read fsid, mon endpoints, pools, filesystems and client names
    steps:
      - name: get-conn-bundle
        description: Capture the non-secret connection bundle via ceph
        task:
          type: model_method
          modelIdOrName: cephadm
          methodName: cephGetConnBundle
          inputs:
            host: ${{ inputs.host }}
            port: ${{ inputs.port }}
            sshUser: ${{ inputs.sshUser }}
            keyPath: '${{ inputs.keyPath == "" ? dyn(null) : dyn(inputs.keyPath) }}'
            host_key_policy: ${{ inputs.host_key_policy }}

            host_keys: ${{ inputs.host_keys }}
