description: "Configure Linux host networking over SSH — a bridge (Linux or OVS), a VLAN-tagged storage plane and jumbo MTU — under an automatic revert armed before anything is changed. Every interface, MAC, VLAN id, MTU and address is an input, and the host-key policy is required; one definition serves any host."
