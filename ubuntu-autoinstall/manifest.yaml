manifestVersion: 1
name: "@randybias/ubuntu-autoinstall"
version: "2026.10.17.1"
description: "Render, validate and publish an Ubuntu Server autoinstall NoCloud seed from typed inputs, over SSH to an artifact-server root or for a CIDATA image. The password is a crypt hash from vault and no output carries a plaintext."
