id: 7a2c4d5e-6f70-4a1b-9c2d-3e4f5a6b7c8d
name: "@randybias/k0s-multinode-join-node"
version: 1
description: >-
  Join one node to an existing k0s cluster: mint a short-lived token into a
  vault key, install k0s on the node with that token, wait for it to join, and
  invalidate the token whichever way the install ends. Called once per node by
  the cluster workflows, sequentially.
vaults:
  - k0s-multinode
  - default
inputs:
  type: object
  additionalProperties: false
  required:
    - cluster
    - controller
    - node
  properties:
    cluster:
      type: object
      additionalProperties: false
      required:
        - cluster_name
        - k0s_version
        - k0s_binary_sha256
        - pod_cidr
        - service_cidr
      properties:
        cluster_name:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
        k0s_version:
          type: string
        k0s_binary_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        pod_cidr:
          type: string
        service_cidr:
          type: string
        storage_type:
          type: string
          enum: [etcd, kine]
          default: etcd
        api_address:
          type: string
          default: ""
        api_port:
          type: integer
          default: 6443
        external_address:
          type: string
          default: ""
        node_local_load_balancing:
          type: boolean
          default: false
        etcd_peer_address:
          type: string
          default: ""
        api_sans:
          type: array
          items:
            type: string
          default: []
        control_plane_load_balancing:
          type: object
    controller:
      type: object
      additionalProperties: false
      required:
        - name
        - ssh_host
        - ssh_user
        - host_key_policy
        - known_hosts
        - ssh_private_key_key
      properties:
        name:
          type: string
        ssh_host:
          type: string
        ssh_user:
          type: string
          default: root
        ssh_port:
          type: integer
          default: 22
        host_key_policy:
          type: string
          enum: [strict]
        known_hosts:
          type: array
          items:
            type: string
        ssh_private_key_key:
          type: string
    node:
      type: object
      additionalProperties: false
      required:
        - name
        - role
        - ssh_host
        - private_address
        - ssh_user
        - host_key_policy
        - known_hosts
        - ssh_private_key_key
        - token_key
      properties:
        name:
          type: string
          pattern: "^[a-z0-9](?:[a-z0-9.-]{0,251}[a-z0-9])?$"
        role:
          type: string
          enum: [controller, controller_worker, worker]
        ssh_host:
          type: string
        private_address:
          type: string
        ssh_user:
          type: string
          default: root
        ssh_port:
          type: integer
          default: 22
        host_key_policy:
          type: string
          enum: [strict]
        known_hosts:
          type: array
          items:
            type: string
        ssh_private_key_key:
          type: string
        token_key:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$"
        no_taints:
          type: boolean
          default: false
    token_expiry:
      type: string
      pattern: '^\d{1,3}(m|h)$'
      default: "1h"
    joined_timeout_s:
      type: integer
      default: 600
jobs:
  - name: join
    description: Mint, install with the token, wait, and always invalidate
    steps:
      - name: mint
        description: Mint this node's role token into its vault key
        task:
          type: model_method
          modelType: "@randybias/k0s-multinode"
          modelName: k0s-multinode
          methodName: mint_join_token
          inputs:
            cluster_name: ${{ inputs.cluster.cluster_name }}
            ssh:
              host: ${{ inputs.controller.ssh_host }}
              user: ${{ inputs.controller.ssh_user }}
              port: ${{ inputs.controller.ssh_port }}
              host_key_policy: ${{ inputs.controller.host_key_policy }}
              host_keys: ${{ inputs.controller.known_hosts }}
              private_key: ${{ vault.get("k0s-multinode", inputs.controller.ssh_private_key_key) }}
            role: '${{ inputs.node.role == "worker" ? "worker" : "controller" }}'
            token_expiry: ${{ inputs.token_expiry }}
            token_vault:
              vault: k0s-multinode
              key: ${{ inputs.node.token_key }}
      - name: install
        description: Install k0s on the node with the minted token
        dependsOn:
          - step: mint
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@randybias/k0s-cluster"
          modelName: k0s-cluster-${{ inputs.node.name }}
          methodName: install
          inputs:
            ssh:
              host: ${{ inputs.node.ssh_host }}
              user: ${{ inputs.node.ssh_user }}
              port: ${{ inputs.node.ssh_port }}
              host_key_policy: ${{ inputs.node.host_key_policy }}
              host_keys: ${{ inputs.node.known_hosts }}
              private_key: ${{ vault.get("k0s-multinode", inputs.node.ssh_private_key_key) }}
            role: ${{ inputs.node.role }}
            no_taints: ${{ inputs.node.no_taints }}
            join_token: ${{ vault.get("k0s-multinode", inputs.node.token_key) }}
            k0s_version: ${{ inputs.cluster.k0s_version }}
            k0s_binary_sha256: ${{ inputs.cluster.k0s_binary_sha256 }}
            cluster_name: ${{ inputs.cluster.cluster_name }}
            pod_cidr: ${{ inputs.cluster.pod_cidr }}
            service_cidr: ${{ inputs.cluster.service_cidr }}
            storage_type: ${{ inputs.cluster.storage_type }}
            api_address: '${{ inputs.cluster.api_address == "" ? null : inputs.cluster.api_address }}'
            api_port: ${{ inputs.cluster.api_port }}
            external_address: '${{ inputs.cluster.external_address == "" ? null : inputs.cluster.external_address }}'
            node_local_load_balancing: ${{ inputs.cluster.node_local_load_balancing }}
            etcd_peer_address: "${{ inputs.node.private_address }}"
            api_sans: ${{ inputs.cluster.api_sans }}
            control_plane_load_balancing: "${{ has(inputs.cluster.control_plane_load_balancing) ? inputs.cluster.control_plane_load_balancing : null }}"
      - name: wait
        description: Wait for this node to join
        dependsOn:
          - step: install
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@randybias/k0s-multinode"
          modelName: k0s-multinode
          methodName: wait_joined
          inputs:
            cluster_name: ${{ inputs.cluster.cluster_name }}
            ssh:
              host: ${{ inputs.controller.ssh_host }}
              user: ${{ inputs.controller.ssh_user }}
              port: ${{ inputs.controller.ssh_port }}
              host_key_policy: ${{ inputs.controller.host_key_policy }}
              host_keys: ${{ inputs.controller.known_hosts }}
              private_key: ${{ vault.get("k0s-multinode", inputs.controller.ssh_private_key_key) }}
            node: ${{ inputs.node.name }}
            role: '${{ inputs.node.role == "worker" ? "worker" : "controller" }}'
            timeout_s: ${{ inputs.joined_timeout_s }}
      - name: invalidate
        description: Invalidate the token after the wait (success or failure)
        dependsOn:
          - step: wait
            condition:
              type: completed
        task:
          type: model_method
          modelType: "@randybias/k0s-multinode"
          modelName: k0s-multinode
          methodName: invalidate_join_token
          inputs:
            cluster_name: ${{ inputs.cluster.cluster_name }}
            ssh:
              host: ${{ inputs.controller.ssh_host }}
              user: ${{ inputs.controller.ssh_user }}
              port: ${{ inputs.controller.ssh_port }}
              host_key_policy: ${{ inputs.controller.host_key_policy }}
              host_keys: ${{ inputs.controller.known_hosts }}
              private_key: ${{ vault.get("k0s-multinode", inputs.controller.ssh_private_key_key) }}
            token_vault:
              vault: k0s-multinode
              key: ${{ inputs.node.token_key }}
      - name: invalidate-failed
        description: Invalidate the token when the install failed (wait would be skipped)
        dependsOn:
          - step: install
            condition:
              type: failed
        task:
          type: model_method
          modelType: "@randybias/k0s-multinode"
          modelName: k0s-multinode
          methodName: invalidate_join_token
          inputs:
            cluster_name: ${{ inputs.cluster.cluster_name }}
            ssh:
              host: ${{ inputs.controller.ssh_host }}
              user: ${{ inputs.controller.ssh_user }}
              port: ${{ inputs.controller.ssh_port }}
              host_key_policy: ${{ inputs.controller.host_key_policy }}
              host_keys: ${{ inputs.controller.known_hosts }}
              private_key: ${{ vault.get("k0s-multinode", inputs.controller.ssh_private_key_key) }}
            token_vault:
              vault: k0s-multinode
              key: ${{ inputs.node.token_key }}
