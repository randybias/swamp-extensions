id: 81b1bccb-23ec-4703-8e09-e97a8591e1b2
name: "@randybias/server-stack-provision-host"
version: 1
description: Build a hardened k0s host running NATS on the mesh, then publish its DNS
vaults:
  - server-stack
  - default
inputs:
  type: object
  additionalProperties: false
  required:
    - hostname
    - ownership_tag
    - server_model
    - project_id
    - plan
    - region
    - image
    - cycle
    - ssh_private_key_key
    - user_data_key
    - wg_private_key_key
    - kubeconfig_key
    - ssh_user
    - host_key_policy
    - admin_user
    - mesh_node
    - mesh_peers
    - mesh_peers_allowlist
    - management_cidrs
    - verify_timeout_s
    - k0s_version
    - k0s_binary_sha256
    - k0s_api_sans
    - k0s_pod_cidr
    - k0s_service_cidr
    - nats_chart
  properties:
    hostname:
      type: string
      description: Server hostname; keys every model's state
      maxLength: 253
      pattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*$'
    adopt:
      type: boolean
      description: Allow an existing owned server and record
      default: false
    ownership_tag:
      type: string
      description: Server ownership tag, key=value
      pattern: "^[A-Za-z0-9_.:/-]{1,128}=[A-Za-z0-9_.:/-]{1,256}$"
    server_model:
      type: string
      description: Name of a generic servers definition
      maxLength: 128
    project_id:
      type: integer
      description: Cherry Servers project ID
      minimum: 1
    plan:
      type: string
      description: Cherry Servers plan slug
      maxLength: 128
    region:
      type: string
      description: Cherry Servers region slug
      maxLength: 128
    image:
      type: string
      description: Cherry Servers image slug
      maxLength: 256
    cycle:
      type: string
      description: Cherry Servers billing cycle
      enum: [hourly, monthly, annually]
    ssh_keys:
      type: array
      description: Cherry Servers SSH key IDs
      default: []
      uniqueItems: true
      items:
        type: integer
        minimum: 1
    tags:
      type: object
      description: Server tag key and value pairs; must include the ownership_tag pair
      default: {}
      additionalProperties:
        type: string
        maxLength: 256
    os_partition_size:
      type: integer
      description: OS partition size in GB, for bare metal
      default: null
      minimum: 1
    ssh_private_key_key:
      type: string
      description: Vault key of the admin SSH private key
      maxLength: 256
    user_data_key:
      type: string
      description: Vault key of cloud-init user data with the pinned host keys
      maxLength: 256
    cloudflare_token_key:
      type: string
      description: Vault key of a Cloudflare DNS edit token
      default: ""
      maxLength: 256
    wg_private_key_key:
      type: string
      description: Vault key of the node WireGuard private key
      maxLength: 256
    kubeconfig_key:
      type: string
      description: Vault key the admin kubeconfig is written to
      maxLength: 256
    ssh_user:
      type: string
      description: Remote SSH user
      maxLength: 32
    ssh_port:
      type: integer
      description: Remote SSH port, 1-65535
      minimum: 1
      maximum: 65535
      default: 22
    host_key_policy:
      type: string
      description: SSH host-key policy
      enum: [strict, accept-new]
    known_hosts:
      type: array
      description: Expected host keys in ssh-keyscan format; each line must be in 'host type key' ssh-keyscan form, with the host field matching the address used
      default: []
      items:
        type: string
        maxLength: 4096
    ready_timeout_s:
      type: integer
      description: Cherry readiness timeout in seconds
      minimum: 10
      maximum: 7200
      default: 2700
    base_packages:
      type: array
      description: Debian package names to install
      default: []
      items:
        type: string
        maxLength: 64
    admin_user:
      type: string
      description: Administrative account to create
      maxLength: 32
    authorized_keys:
      type: array
      description: Public keys authorized for the admin account
      default: []
      items:
        type: string
        maxLength: 4096
    sysctl:
      type: object
      description: Sysctl keys and values
      default: {}
      additionalProperties:
        type: string
        maxLength: 128
    timezone:
      type: string
      description: Time zone, for example UTC
      default: UTC
      maxLength: 64
    mesh_node:
      type: object
      description: This node's mesh record
      additionalProperties: false
      required: [name, address, listen_port]
      properties:
        name:
          type: string
          maxLength: 63
        address:
          type: string
          maxLength: 64
        listen_port:
          type: integer
          minimum: 1
          maximum: 65535
        endpoint:
          type: string
          maxLength: 255
    mesh_peers:
      type: array
      description: Mesh peers visible to this node
      items:
        type: object
        additionalProperties: false
        required: [name, public_key, allowed_ips]
        properties:
          name:
            type: string
            maxLength: 63
          public_key:
            type: string
            maxLength: 44
          allowed_ips:
            type: array
            items:
              type: string
              maxLength: 64
          endpoint:
            type: string
            maxLength: 255
          keepalive:
            type: integer
            minimum: 0
            maximum: 65535
    mesh_peers_allowlist:
      type: array
      description: Peer names or public keys allowed in the mesh
      items:
        type: string
        maxLength: 64
    mesh_relay_exclusion:
      type: array
      description: Relay exclusion rules
      default: []
      items:
        type: object
        additionalProperties: false
        required: [exclude, for_nodes]
        properties:
          exclude:
            type: array
            minItems: 1
            items:
              type: string
              maxLength: 63
          for_nodes:
            type: array
            minItems: 1
            items:
              type: string
              maxLength: 63
          via:
            type: string
            maxLength: 63
    mesh_handshake_wait_s:
      type: integer
      description: Longest wait, in seconds, for the first WireGuard handshake before it is checked; 0 skips the wait
      minimum: 0
      maximum: 600
      default: 60
    mesh_handshake_max_age_s:
      type: integer
      description: Reserved; not evaluated because swamp CEL has no clock function
      minimum: 10
      maximum: 3600
      default: 180
    management_cidrs:
      type: array
      description: CIDRs allowed to reach SSH and admin ports
      minItems: 1
      items:
        type: string
        maxLength: 64
    trusted_interfaces:
      type: array
      description: Interface names or prefix* patterns whose traffic the firewall accepts; the k0s CNI bridge
      default: [kube-bridge]
      maxItems: 16
      items:
        type: string
        maxLength: 15
        pattern: "^[A-Za-z0-9_.-]{1,14}[*]$|^[A-Za-z0-9_.-]{1,15}$"
    allow_tcp:
      type: array
      description: Public TCP ports
      default: []
      items:
        type: integer
        minimum: 1
        maximum: 65535
    allow_udp:
      type: array
      description: Public UDP ports; must include the mesh listen port
      default: []
      items:
        type: integer
        minimum: 1
        maximum: 65535
    revert_after_s:
      type: integer
      description: Seconds before an uncommitted change reverts, 60-1800
      minimum: 60
      maximum: 1800
      default: 300
    verify_timeout_s:
      type: integer
      description: Seconds to prove reachability after a change
      minimum: 10
      maximum: 1740
    k0s_version:
      type: string
      description: Pinned k0s version, for example v1.31.2+k0s.0
      maxLength: 64
    k0s_binary_sha256:
      type: string
      description: SHA-256 of the k0s binary, 64 hex characters
      pattern: "^[0-9a-f]{64}$"
    k0s_download_url:
      type: string
      description: Optional k0s binary URL override
      default: null
      maxLength: 512
    k0s_api_sans:
      type: array
      description: API server certificate SANs; must include the mesh address
      items:
        type: string
        maxLength: 253
    k0s_pod_cidr:
      type: string
      description: Pod network CIDR
      maxLength: 64
    k0s_service_cidr:
      type: string
      description: Service network CIDR
      maxLength: 64
    cluster_namespaces:
      type: array
      description: DNS-1123 namespaces created before secrets
      default: []
      items:
        type: string
        pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
    cluster_secrets:
      type: array
      description: Secrets to write; each data value is a vault key
      default: []
      items:
        type: object
        additionalProperties: false
        required: [namespace, name, data]
        properties:
          namespace:
            type: string
            pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$"
          name:
            type: string
            pattern: "^[a-z0-9](?:[a-z0-9.-]{0,251}[a-z0-9])?$"
          type:
            type: string
            default: Opaque
            maxLength: 64
          data:
            type: object
            minProperties: 1
            additionalProperties:
              type: string
              maxLength: 256
    nats_chart:
      type: object
      description: NATS Helm chart, with values exposing the client port on the mesh
      additionalProperties: false
      required: [chart, repo, version, namespace]
      properties:
        chart:
          type: string
          maxLength: 128
        repo:
          type: string
          maxLength: 512
        version:
          type: string
          maxLength: 64
        namespace:
          type: string
          maxLength: 63
        values:
          type: object
    nats_auth_token_key:
      type: string
      description: >-
        Vault key (in server-stack) holding a NATS auth token of 16-256
        characters from A-Z a-z 0-9 . _ ~ + = -. When set, the token is written
        to the Secret named by nats_auth_secret (key `token`, in a namespace
        listed in cluster_namespaces) before the chart is installed, the chart values must read it from
        there (see the README), and the probe must see authentication enforced.
        Unset leaves NATS unauthenticated.
      default: null
      maxLength: 256
    nats_auth_secret:
      type: string
      description: Name of the Secret, in the NATS chart namespace, that receives the token
      default: nats-auth
      pattern: "^[a-z0-9](?:[a-z0-9.-]{0,251}[a-z0-9])?$"
    nats_probe_port:
      type: integer
      description: NATS client port reached over the mesh
      minimum: 1
      maximum: 65535
      default: 4222
    nats_expect_server_name:
      type: string
      description: Expected INFO server_name, if any
      default: null
      maxLength: 253
    cloudflare_zone_id:
      type: string
      description: Cloudflare zone ID
      default: ""
      maxLength: 64
    dns_record_name:
      type: string
      description: Fully qualified A record name
      default: ""
      maxLength: 253
    dns_record_target:
      type: string
      default: public
      description: Which address the A record points at
      enum: [public, mesh]
    dns_ttl:
      type: integer
      description: A record TTL in seconds, 60-86400
      minimum: 60
      maximum: 86400
      default: 300
    publish_dns:
      type: boolean
      description: Publish the A record; false skips every Cloudflare DNS step
      default: true
jobs:
  - name: preflight
    description: Check inputs and probe Cherry and Cloudflare before anything is created
    steps:
      - name: check-inputs
        description: Check cross-input invariants before any remote call
        task:
          type: assert
          expr: >-
            inputs.verify_timeout_s + 60 <= inputs.revert_after_s &&
            inputs.allow_udp.exists(p, p == inputs.mesh_node.listen_port) &&
            size(inputs.management_cidrs) > 0 &&
            (inputs.host_key_policy != "strict" || size(inputs.known_hosts) > 0) &&
            inputs.tags[inputs.ownership_tag.split("=")[0]] == inputs.ownership_tag.split("=")[1] &&
            size(inputs.cluster_secrets) == 0 &&
            (!inputs.publish_dns || (inputs.cloudflare_zone_id != "" &&
            inputs.dns_record_name != "" && inputs.cloudflare_token_key != ""))
          message: Cross-input invariants failed
          severity: high
      - name: probe-server
        description: List the project's servers via the Cherry Servers API
        dependsOn:
          - step: check-inputs
            condition:
              type: succeeded
        task:
          type: model_method
          modelIdOrName: ${{ inputs.server_model }}
          methodName: list
      - name: check-cloudflare-token
        description: Read the zone via the Cloudflare API to prove the token works
        guard: ${{ inputs.publish_dns == false }}
        dependsOn:
          - step: probe-server
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@webframp/cloudflare/zone"
          modelName: cloudflare-zone
          methodName: get
          globalArgs:
            apiToken: ${{ vault.get("server-stack", inputs.cloudflare_token_key) }}
          inputs:
            zoneId: ${{ inputs.cloudflare_zone_id }}
      - name: probe-record
        description: List the target A record via the Cloudflare API
        guard: ${{ inputs.publish_dns == false }}
        dependsOn:
          - step: check-cloudflare-token
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
        task:
          type: model_method
          modelType: "@webframp/cloudflare/dns"
          modelName: host-dns
          methodName: list
          globalArgs:
            zoneId: ${{ inputs.cloudflare_zone_id }}
            apiToken: ${{ vault.get("server-stack", inputs.cloudflare_token_key) }}
          inputs:
            type: A
            name: ${{ inputs.dns_record_name }}
      - name: refuse-existing
        description: Refuse an existing server or record unless adopt is set
        dependsOn:
          - step: probe-server
            condition:
              type: succeeded
          - step: probe-record
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
        task:
          type: assert
          expr: >-
            inputs.adopt ||
            ((data.latest(inputs.server_model, inputs.hostname) == null ||
            data.latest(inputs.server_model, inputs.hostname).attributes.status in ["deleted", "not_found"]) &&
            (!inputs.publish_dns || data.latest("host-dns", "main").attributes.records.size() == 0))
          message: A server or record already exists; set adopt to true to own it
          severity: high
  - name: host
    description: Order the server, wait for SSH, and join it to the mesh
    dependsOn:
      - job: preflight
        condition:
          type: succeeded
    steps:
      - name: create
        description: Order or adopt the server via the Cherry Servers API
        task:
          type: model_method
          modelIdOrName: ${{ inputs.server_model }}
          methodName: create
          inputs:
            hostname: ${{ inputs.hostname }}
            project_id: ${{ inputs.project_id }}
            plan: ${{ inputs.plan }}
            region: ${{ inputs.region }}
            image: ${{ inputs.image }}
            cycle: ${{ inputs.cycle }}
            ssh_keys: ${{ inputs.ssh_keys }}
            tags: ${{ inputs.tags }}
            user_data: ${{ vault.get("server-stack", inputs.user_data_key) }}
            os_partition_size: ${{ inputs.os_partition_size }}
      - name: check-adopt-ownership
        description: Check an adopted server carries the ownership tag
        dependsOn:
          - step: create
            condition:
              type: succeeded
        task:
          type: assert
          expr: >-
            !inputs.adopt ||
            (data.latest(inputs.server_model, inputs.hostname).attributes.tags != null &&
            data.latest(inputs.server_model, inputs.hostname).attributes.tags[inputs.ownership_tag.split("=")[0]] == inputs.ownership_tag.split("=")[1])
          message: The adopted server does not carry the ownership tag
          severity: high
      - name: wait-ready
        description: Wait for SSH with pinned host keys via the Cherry Servers model
        dependsOn:
          - step: check-adopt-ownership
            condition:
              type: succeeded
        guard: ${{ inputs.adopt == true }}
        task:
          type: model_method
          modelIdOrName: ${{ inputs.server_model }}
          methodName: wait_ready
          inputs:
            hostname: ${{ inputs.hostname }}
            host_key_policy: ${{ inputs.host_key_policy }}
            known_hosts: ${{ inputs.known_hosts.join("\n") }}
            ssh_user: ${{ inputs.ssh_user }}
            ssh_private_key: ${{ vault.get("server-stack", inputs.ssh_private_key_key) }}
            timeout_seconds: ${{ inputs.ready_timeout_s }}
      - name: apply-base
        description: Apply base packages, admin user and sysctl via SSH
        dependsOn:
          - step: wait-ready
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: check-adopt-ownership
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@randybias/server-host"
          modelName: server-host
          methodName: apply_base
          inputs:
            identity: ${{ string(data.latest(inputs.server_model, inputs.hostname).attributes.id) }}
            host: >-
              ${{ inputs.adopt
                ? inputs.mesh_node.address.split("/")[0]
                : data.latest(inputs.server_model, inputs.hostname).attributes.public_ipv4 }}
            port: ${{ inputs.ssh_port }}
            user: ${{ inputs.ssh_user }}
            host_key_policy: strict
            host_keys: ${{ inputs.known_hosts }}
            ssh_key_ref:
              vault: server-stack
              key: ${{ inputs.ssh_private_key_key }}
            sudo: true
            packages: ${{ inputs.base_packages }}
            admin_user: ${{ inputs.admin_user }}
            authorized_keys: ${{ inputs.authorized_keys }}
            sysctl: ${{ inputs.sysctl }}
            timezone: ${{ inputs.timezone }}
      - name: join-mesh
        description: Render and push the node's WireGuard config via SSH
        dependsOn:
          - step: apply-base
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@randybias/wireguard-mesh"
          modelName: wireguard-mesh
          methodName: apply
          inputs:
            node: ${{ inputs.mesh_node }}
            peers: ${{ inputs.mesh_peers }}
            peers_allowlist: ${{ inputs.mesh_peers_allowlist }}
            relay_exclusion: ${{ inputs.mesh_relay_exclusion }}
            interface: wg0
            private_key: ${{ vault.get("server-stack", inputs.wg_private_key_key) }}
            ssh:
              host: >-
                ${{ inputs.adopt
                  ? inputs.mesh_node.address.split("/")[0]
                  : data.latest(inputs.server_model, inputs.hostname).attributes.public_ipv4 }}
              port: ${{ inputs.ssh_port }}
              user: ${{ inputs.ssh_user }}
              host_key_policy: strict
              host_keys: '${{ inputs.known_hosts.map(line, {"type": line.split(" ")[size(line.split(" ")) - 2], "key": line.split(" ")[size(line.split(" ")) - 1]}) }}'
              private_key: ${{ vault.get("server-stack", inputs.ssh_private_key_key) }}
      - name: wait-mesh
        description: Wait, bounded, until the mesh address answers so the first handshake has happened
        dependsOn:
          - step: join-mesh
            condition:
              type: succeeded
        guard: ${{ inputs.mesh_handshake_wait_s == 0 }}
        task:
          type: model_method
          modelType: command/shell
          modelName: mesh-wait
          methodName: execute
          inputs:
            # Traffic to the mesh address makes WireGuard handshake at once
            # instead of at the next keepalive. The step never fails: the
            # handshake assertion below is the gate, and a control host that is
            # not a peer simply waits out the bound for the peer's keepalive.
            run: |
              bash -c '
                end=$((SECONDS + WAIT))
                while ! timeout 3 bash -c "exec 3<>/dev/tcp/\$0/\$1" "$HOST" "$PORT" 2>/dev/null; do
                  if [ "$SECONDS" -ge "$end" ]; then
                    echo "no answer from $HOST:$PORT within ${WAIT}s"
                    exit 0
                  fi
                  sleep 2
                done
                echo "answered $HOST:$PORT after ${SECONDS}s"
              '
            env:
              HOST: ${{ inputs.mesh_node.address.split("/")[0] }}
              PORT: ${{ string(inputs.ssh_port) }}
              WAIT: ${{ string(inputs.mesh_handshake_wait_s) }}
            timeout: ${{ (inputs.mesh_handshake_wait_s + 15) * 1000 }}
            ignoreExitCode: true
      - name: verify-mesh
        description: Read the node's WireGuard peers and handshakes via SSH
        dependsOn:
          # join-mesh is named too: a skipped wait must not stand in for a
          # failed join.
          - step: join-mesh
            condition:
              type: succeeded
          - step: wait-mesh
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
        task:
          type: model_method
          modelType: "@randybias/wireguard-mesh"
          modelName: wireguard-mesh
          methodName: get
          inputs:
            node: ${{ inputs.mesh_node.name }}
            interface: wg0
            ssh:
              host: >-
                ${{ inputs.adopt
                  ? inputs.mesh_node.address.split("/")[0]
                  : data.latest(inputs.server_model, inputs.hostname).attributes.public_ipv4 }}
              port: ${{ inputs.ssh_port }}
              user: ${{ inputs.ssh_user }}
              host_key_policy: strict
              host_keys: '${{ inputs.known_hosts.map(line, {"type": line.split(" ")[size(line.split(" ")) - 2], "key": line.split(" ")[size(line.split(" ")) - 1]}) }}'
              private_key: ${{ vault.get("server-stack", inputs.ssh_private_key_key) }}
      - name: check-mesh
        description: Check a recent mesh handshake exists before any firewall change
        dependsOn:
          - step: verify-mesh
            condition:
              type: succeeded
        task:
          type: assert
          expr: >-
            size(data.latest("wireguard-mesh", inputs.mesh_node.name).attributes.peers) > 0 &&
            data.latest("wireguard-mesh", inputs.mesh_node.name).attributes.peers.exists(p,
              p.latest_handshake > 0)
          message: No mesh peer handshake was recorded
          severity: high
  - name: harden
    description: Apply the firewall and lockdown, committing only after fresh reachability
    dependsOn:
      - job: host
        condition:
          type: succeeded
    steps:
      - name: apply-firewall
        description: Apply the nftables ruleset with a revert armed first
        task:
          type: model_method
          modelType: "@randybias/server-host"
          modelName: server-host
          methodName: apply_firewall
          inputs:
            identity: ${{ string(data.latest(inputs.server_model, inputs.hostname).attributes.id) }}
            host: ${{ inputs.mesh_node.address.split("/")[0] }}
            port: ${{ inputs.ssh_port }}
            user: ${{ inputs.ssh_user }}
            host_key_policy: strict
            host_keys: ${{ inputs.known_hosts }}
            ssh_key_ref:
              vault: server-stack
              key: ${{ inputs.ssh_private_key_key }}
            management_cidrs: ${{ inputs.management_cidrs }}
            allow_tcp: ${{ inputs.allow_tcp }}
            allow_udp: ${{ inputs.allow_udp }}
            ssh_port: ${{ inputs.ssh_port }}
            allow_ssh_from_anywhere: >-
              ${{ !(inputs.adopt &&
                data.latest("server-host", "state-" + inputs.mesh_node.address.split("/")[0]) != null &&
                "firewall" in data.latest("server-host", "state-" + inputs.mesh_node.address.split("/")[0]).attributes &&
                data.latest("server-host", "state-" + inputs.mesh_node.address.split("/")[0]).attributes.firewall.ssh_exposure == "management-only") }}
            trusted_interfaces: ${{ inputs.trusted_interfaces }}
            revert_after_s: ${{ inputs.revert_after_s }}
      - name: verify-firewall
        description: Verify SSH answers over the mesh after the firewall
        dependsOn:
          - step: apply-firewall
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@randybias/ssh-host"
          modelName: ssh-host
          methodName: wait_connection
          inputs:
            host: ${{ inputs.mesh_node.address.split("/")[0] }}
            port: ${{ inputs.ssh_port }}
            user: ${{ inputs.ssh_user }}
            host_key_policy: strict
            host_keys: ${{ inputs.known_hosts }}
            timeout_s: ${{ inputs.verify_timeout_s }}
      - name: commit-firewall
        description: Commit the firewall by cancelling its armed revert
        dependsOn:
          - step: verify-firewall
            condition:
              type: succeeded
        guard: >-
          ${{ data.latest("server-host", "revert-" + inputs.mesh_node.address.split("/")[0]) == null ||
              "committed_at" in data.latest("server-host", "revert-" + inputs.mesh_node.address.split("/")[0]).attributes ||
              "cancelled_at" in data.latest("server-host", "revert-" + inputs.mesh_node.address.split("/")[0]).attributes }}
        task:
          type: model_method
          modelType: "@randybias/server-host"
          modelName: server-host
          methodName: commit
          inputs:
            identity: ${{ string(data.latest(inputs.server_model, inputs.hostname).attributes.id) }}
            host: ${{ inputs.mesh_node.address.split("/")[0] }}
            port: ${{ inputs.ssh_port }}
            user: ${{ inputs.ssh_user }}
            host_key_policy: strict
            host_keys: ${{ inputs.known_hosts }}
            ssh_key_ref:
              vault: server-stack
              key: ${{ inputs.ssh_private_key_key }}
      - name: lockdown
        description: Close public SSH to the management CIDRs with a revert armed
        dependsOn:
          - step: commit-firewall
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: verify-firewall
            condition:
              type: succeeded
          - step: apply-firewall
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@randybias/server-host"
          modelName: server-host
          methodName: lockdown
          inputs:
            identity: ${{ string(data.latest(inputs.server_model, inputs.hostname).attributes.id) }}
            host: ${{ inputs.mesh_node.address.split("/")[0] }}
            port: ${{ inputs.ssh_port }}
            user: ${{ inputs.ssh_user }}
            host_key_policy: strict
            host_keys: ${{ inputs.known_hosts }}
            ssh_key_ref:
              vault: server-stack
              key: ${{ inputs.ssh_private_key_key }}
            management_cidrs: ${{ inputs.management_cidrs }}
            allow_tcp: ${{ inputs.allow_tcp }}
            allow_udp: ${{ inputs.allow_udp }}
            trusted_interfaces: ${{ inputs.trusted_interfaces }}
            ssh_port: ${{ inputs.ssh_port }}
            revert_after_s: ${{ inputs.revert_after_s }}
      - name: verify-lockdown
        description: Verify SSH answers over the mesh after the lockdown
        dependsOn:
          - step: lockdown
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@randybias/ssh-host"
          modelName: ssh-host
          methodName: wait_connection
          inputs:
            host: ${{ inputs.mesh_node.address.split("/")[0] }}
            port: ${{ inputs.ssh_port }}
            user: ${{ inputs.ssh_user }}
            host_key_policy: strict
            host_keys: ${{ inputs.known_hosts }}
            timeout_s: ${{ inputs.verify_timeout_s }}
      - name: inspect-lockdown
        description: Read the recorded firewall and exposure state via SSH
        dependsOn:
          - step: verify-lockdown
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@randybias/server-host"
          modelName: server-host
          methodName: get
          inputs:
            identity: ${{ string(data.latest(inputs.server_model, inputs.hostname).attributes.id) }}
            host: ${{ inputs.mesh_node.address.split("/")[0] }}
            port: ${{ inputs.ssh_port }}
            user: ${{ inputs.ssh_user }}
            host_key_policy: strict
            host_keys: ${{ inputs.known_hosts }}
            ssh_key_ref:
              vault: server-stack
              key: ${{ inputs.ssh_private_key_key }}
      - name: check-lockdown
        description: Check SSH exposure is management-only before committing
        dependsOn:
          - step: inspect-lockdown
            condition:
              type: succeeded
        task:
          type: assert
          expr: >-
            data.latest("server-host", "state-" +
              inputs.mesh_node.address.split("/")[0]).attributes.firewall.ssh_exposure ==
            "management-only"
          message: SSH exposure is not management-only after lockdown
          severity: high
      - name: commit-lockdown
        description: Commit the lockdown by cancelling its armed revert
        dependsOn:
          - step: check-lockdown
            condition:
              type: succeeded
        guard: >-
          ${{ data.latest("server-host", "revert-" + inputs.mesh_node.address.split("/")[0]) == null ||
              "committed_at" in data.latest("server-host", "revert-" + inputs.mesh_node.address.split("/")[0]).attributes ||
              "cancelled_at" in data.latest("server-host", "revert-" + inputs.mesh_node.address.split("/")[0]).attributes }}
        task:
          type: model_method
          modelType: "@randybias/server-host"
          modelName: server-host
          methodName: commit
          inputs:
            identity: ${{ string(data.latest(inputs.server_model, inputs.hostname).attributes.id) }}
            host: ${{ inputs.mesh_node.address.split("/")[0] }}
            port: ${{ inputs.ssh_port }}
            user: ${{ inputs.ssh_user }}
            host_key_policy: strict
            host_keys: ${{ inputs.known_hosts }}
            ssh_key_ref:
              vault: server-stack
              key: ${{ inputs.ssh_private_key_key }}
  - name: cluster
    description: Install k0s, write the kubeconfig, and run the secrets and NATS chart
    dependsOn:
      - job: harden
        condition:
          type: succeeded
    steps:
      - name: install-k0s
        description: Install the SHA-pinned k0s binary and start the node via SSH
        task:
          type: model_method
          modelType: "@randybias/k0s-cluster"
          modelName: k0s-cluster
          methodName: install
          inputs:
            ssh:
              host: ${{ inputs.mesh_node.address.split("/")[0] }}
              port: ${{ inputs.ssh_port }}
              user: ${{ inputs.ssh_user }}
              host_key_policy: strict
              host_keys: ${{ inputs.known_hosts }}
              private_key: ${{ vault.get("server-stack", inputs.ssh_private_key_key) }}
            k0s_version: ${{ inputs.k0s_version }}
            k0s_binary_sha256: ${{ inputs.k0s_binary_sha256 }}
            k0s_download_url: ${{ inputs.k0s_download_url }}
            role: single
            cluster_name: ${{ inputs.hostname }}
            api_sans: ${{ inputs.k0s_api_sans }}
            api_address: ${{ inputs.mesh_node.address.split("/")[0] }}
            pod_cidr: ${{ inputs.k0s_pod_cidr }}
            service_cidr: ${{ inputs.k0s_service_cidr }}
            helm:
              - ${{ inputs.nats_chart }}
      - name: wait-k0s
        description: Wait for the node and system pods to be Ready
        dependsOn:
          - step: install-k0s
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@randybias/k0s-cluster"
          modelName: k0s-cluster
          methodName: wait_ready
          inputs:
            ssh:
              host: ${{ inputs.mesh_node.address.split("/")[0] }}
              port: ${{ inputs.ssh_port }}
              user: ${{ inputs.ssh_user }}
              host_key_policy: strict
              host_keys: ${{ inputs.known_hosts }}
              private_key: ${{ vault.get("server-stack", inputs.ssh_private_key_key) }}
            ready_timeout_s: ${{ inputs.ready_timeout_s }}
            require_system_pods: true
      - name: check-k0s
        description: Check the node and system pods are Ready
        dependsOn:
          - step: wait-k0s
            condition:
              type: succeeded
        task:
          type: assert
          expr: >-
            data.latest("k0s-cluster", inputs.ssh_user + "~" + inputs.mesh_node.address.split("/")[0] + "~" + string(inputs.ssh_port) + "~readiness")
              .attributes.ready == true
          message: k0s node or system pods are not Ready
          severity: high
      - name: kubeconfig
        description: Write the admin kubeconfig to the vault via k0s
        dependsOn:
          - step: check-k0s
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@randybias/k0s-cluster"
          modelName: k0s-cluster
          methodName: kubeconfig
          inputs:
            api_address: ${{ inputs.mesh_node.address.split("/")[0] }}
            ssh:
              host: ${{ inputs.mesh_node.address.split("/")[0] }}
              port: ${{ inputs.ssh_port }}
              user: ${{ inputs.ssh_user }}
              host_key_policy: strict
              host_keys: ${{ inputs.known_hosts }}
              private_key: ${{ vault.get("server-stack", inputs.ssh_private_key_key) }}
            store_in_vault:
              vault: server-stack
              key: ${{ inputs.kubeconfig_key }}
      - name: check-kubeconfig
        description: Check the kubeconfig server is the node's route address
        dependsOn:
          - step: kubeconfig
            condition:
              type: succeeded
        task:
          type: assert
          expr: >-
            data.latest("k0s-cluster", inputs.ssh_user + "~" + inputs.mesh_node.address.split("/")[0] + "~" + string(inputs.ssh_port) + "~kubeconfig")
              .attributes.server != null &&
            data.latest("k0s-cluster", inputs.ssh_user + "~" + inputs.mesh_node.address.split("/")[0] + "~" + string(inputs.ssh_port) + "~kubeconfig")
              .attributes.server.endsWith(":6443")
          message: The kubeconfig server URL is missing
          severity: high
      - name: apply-namespaces
        description: Create the cluster namespaces via the k0s manifest deployer
        dependsOn:
          - step: check-kubeconfig
            condition:
              type: succeeded
        guard: ${{ size(inputs.cluster_namespaces) == 0 }}
        task:
          type: model_method
          modelType: "@randybias/k0s-cluster"
          modelName: k0s-cluster
          methodName: apply_manifests
          inputs:
            ssh:
              host: ${{ inputs.mesh_node.address.split("/")[0] }}
              port: ${{ inputs.ssh_port }}
              user: ${{ inputs.ssh_user }}
              host_key_policy: strict
              host_keys: ${{ inputs.known_hosts }}
              private_key: ${{ vault.get("server-stack", inputs.ssh_private_key_key) }}
            stack:
              name: server-stack-namespaces
              files:
                - path: namespaces.yaml
                  content: >-
                    ${{ inputs.cluster_namespaces.map(n,
                    "apiVersion: v1\nkind: Namespace\nmetadata:\n  name: " + n + "\n").join("---\n") }}
      - name: apply-secrets
        description: Write each cluster Secret from vault values via kubectl stdin
        dependsOn:
          - step: apply-namespaces
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: check-kubeconfig
            condition:
              type: succeeded
        guard: ${{ size(inputs.cluster_secrets) == 0 }}
        forEach:
          item: secret
          in: ${{ inputs.cluster_secrets }}
        task:
          type: model_method
          modelType: "@randybias/k8s-secret"
          modelName: k8s-secret
          methodName: apply
          inputs:
            kubeconfig: ${{ vault.get("server-stack", inputs.kubeconfig_key) }}
            namespace: ${{ self.secret.namespace }}
            name: ${{ self.secret.name }}
            type: >-
              ${{ has(self.secret.type) ? self.secret.type : "Opaque" }}
            data: ${{ self.secret.data }}
      - name: check-nats-token
        description: Check the NATS auth token is YAML-safe before it is written into a manifest
        dependsOn:
          - step: check-kubeconfig
            condition:
              type: succeeded
        guard: ${{ inputs.nats_auth_token_key == null }}
        task:
          type: model_method
          modelType: command/shell
          modelName: nats-token-check
          methodName: execute
          inputs:
            # Asserts cannot read the vault, so the shape is checked in a shell
            # that gets the token through its environment. Output is the verdict only.
            run: |
              bash -c '
                [[ "$NATS_TOKEN" =~ ^[A-Za-z0-9._~+=-]{16,256}$ ]] ||
                  { echo "token must be 16-256 characters from A-Z a-z 0-9 . _ ~ + = -"; exit 1; }
                echo "token shape ok"
              '
            env:
              NATS_TOKEN: ${{ vault.get("server-stack", inputs.nats_auth_token_key) }}
            timeout: 10000
            ignoreExitCode: false
      - name: apply-nats-auth
        description: Write the NATS auth token Secret on the host through the k0s manifest deployer
        dependsOn:
          - step: check-nats-token
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: check-kubeconfig
            condition:
              type: succeeded
          - step: apply-namespaces
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
        guard: ${{ inputs.nats_auth_token_key == null }}
        task:
          type: model_method
          modelType: "@randybias/k0s-cluster"
          modelName: k0s-cluster
          methodName: apply_manifests
          inputs:
            ssh:
              host: ${{ inputs.mesh_node.address.split("/")[0] }}
              port: ${{ inputs.ssh_port }}
              user: ${{ inputs.ssh_user }}
              host_key_policy: strict
              host_keys: ${{ inputs.known_hosts }}
              private_key: ${{ vault.get("server-stack", inputs.ssh_private_key_key) }}
            stack:
              name: server-stack-nats-auth
              files:
                # The API is not reachable from the control host (the firewall
                # opens no 6443), so the Secret is applied on the host. The
                # content is a sensitive input and only its hash is recorded.
                - path: nats-auth.yaml
                  content: >-
                    ${{ "apiVersion: v1\nkind: Secret\nmetadata:\n  name: " + inputs.nats_auth_secret +
                    "\n  namespace: " + inputs.nats_chart.namespace +
                    "\ntype: Opaque\nstringData:\n  token: \"" +
                    vault.get("server-stack", inputs.nats_auth_token_key) + "\"\n" }}
      - name: apply-nats
        description: Reconcile the NATS chart via the k0s Helm extension
        guard: ${{ size(inputs.cluster_secrets) > 0 }}
        dependsOn:
          - step: apply-nats-auth
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: apply-namespaces
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: check-kubeconfig
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@randybias/k0s-cluster"
          modelName: k0s-cluster
          methodName: apply_helm
          inputs:
            ssh:
              host: ${{ inputs.mesh_node.address.split("/")[0] }}
              port: ${{ inputs.ssh_port }}
              user: ${{ inputs.ssh_user }}
              host_key_policy: strict
              host_keys: ${{ inputs.known_hosts }}
              private_key: ${{ vault.get("server-stack", inputs.ssh_private_key_key) }}
            cluster_name: ${{ inputs.hostname }}
            api_sans: ${{ inputs.k0s_api_sans }}
            api_address: ${{ inputs.mesh_node.address.split("/")[0] }}
            pod_cidr: ${{ inputs.k0s_pod_cidr }}
            service_cidr: ${{ inputs.k0s_service_cidr }}
            helm:
              - ${{ inputs.nats_chart }}
      - name: apply-nats-after-secrets
        description: Reconcile the NATS chart via the k0s Helm extension
        guard: ${{ size(inputs.cluster_secrets) == 0 }}
        dependsOn:
          - step: apply-nats-auth
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: apply-secrets
            condition:
              type: succeeded
          - step: apply-namespaces
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: check-kubeconfig
            condition:
              type: succeeded
        task:
          type: model_method
          modelType: "@randybias/k0s-cluster"
          modelName: k0s-cluster
          methodName: apply_helm
          inputs:
            ssh:
              host: ${{ inputs.mesh_node.address.split("/")[0] }}
              port: ${{ inputs.ssh_port }}
              user: ${{ inputs.ssh_user }}
              host_key_policy: strict
              host_keys: ${{ inputs.known_hosts }}
              private_key: ${{ vault.get("server-stack", inputs.ssh_private_key_key) }}
            cluster_name: ${{ inputs.hostname }}
            api_sans: ${{ inputs.k0s_api_sans }}
            api_address: ${{ inputs.mesh_node.address.split("/")[0] }}
            pod_cidr: ${{ inputs.k0s_pod_cidr }}
            service_cidr: ${{ inputs.k0s_service_cidr }}
            helm:
              - ${{ inputs.nats_chart }}
  - name: verify
    description: Prove NATS answers over the mesh before any DNS is published
    dependsOn:
      - job: cluster
        condition:
          type: succeeded
    steps:
      - name: probe-nats
        description: Read the NATS INFO banner over the mesh via a TCP probe
        guard: ${{ inputs.nats_auth_token_key != null }}
        task:
          type: model_method
          modelType: command/shell
          modelName: nats-probe
          methodName: execute
          inputs:
            run: |
              bash -c '
                exec 3<>/dev/tcp/"$NATS_HOST"/"$NATS_PORT" || exit 1
                IFS= read -r info <&3
                printf "%s\n" "$info"
                printf "CONNECT {}\r\nPING\r\n" >&3
                IFS= read -r pong <&3
                printf "%s\n" "$pong"
              '
            env:
              NATS_HOST: ${{ inputs.mesh_node.address.split("/")[0] }}
              NATS_PORT: ${{ string(inputs.nats_probe_port) }}
            timeout: ${{ inputs.verify_timeout_s * 1000 }}
            ignoreExitCode: false
      - name: probe-nats-auth
        description: Probe NATS with the token, then prove a connection without it is refused
        guard: ${{ inputs.nats_auth_token_key == null }}
        task:
          type: model_method
          modelType: command/shell
          modelName: nats-probe
          methodName: execute
          inputs:
            # The token reaches the probe only through the environment.
            run: |
              bash -c '
                exec 3<>/dev/tcp/"$NATS_HOST"/"$NATS_PORT" || exit 1
                IFS= read -r info <&3
                printf "%s\n" "$info"
                token=${NATS_TOKEN//\\/\\\\}
                token=${token//\"/\\\"}
                printf "CONNECT {\"auth_token\":\"%s\"}\r\nPING\r\n" "$token" >&3
                IFS= read -r pong <&3
                printf "%s\n" "$pong"
                exec 4<>/dev/tcp/"$NATS_HOST"/"$NATS_PORT" || exit 1
                IFS= read -r _ <&4
                printf "CONNECT {}\r\nPING\r\n" >&4
                IFS= read -r denied <&4
                printf "unauthenticated: %s\n" "$denied"
              '
            env:
              NATS_HOST: ${{ inputs.mesh_node.address.split("/")[0] }}
              NATS_PORT: ${{ string(inputs.nats_probe_port) }}
              NATS_TOKEN: ${{ vault.get("server-stack", inputs.nats_auth_token_key) }}
            timeout: ${{ inputs.verify_timeout_s * 1000 }}
            ignoreExitCode: false
      - name: check-nats
        description: Check the banner is NATS INFO with the expected server name and, with auth on, that auth is enforced
        dependsOn:
          # Exactly one probe runs (complementary guards); a failed probe
          # fails the verify job, which blocks the publish job.
          - step: probe-nats
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
          - step: probe-nats-auth
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
        task:
          type: assert
          expr: >-
            data.latest("nats-probe", "result").attributes.stdout.contains("INFO {") &&
            data.latest("nats-probe", "result").attributes.stdout.contains("server_id") &&
            (inputs.nats_expect_server_name == null ||
            data.latest("nats-probe", "result").attributes.stdout.contains(
              "\"server_name\":\"" + inputs.nats_expect_server_name + "\"")) &&
            (inputs.nats_auth_token_key == null ||
            (data.latest("nats-probe", "result").attributes.stdout.contains("\"auth_required\":true") &&
            data.latest("nats-probe", "result").attributes.stdout.contains("\n+OK") &&
            data.latest("nats-probe", "result").attributes.stdout.contains("unauthenticated: -ERR 'Authorization Violation'")))
          message: The NATS INFO banner was not as expected, or auth is not enforced
          severity: high
  - name: publish
    description: Create and verify the host's A record only after NATS answers
    dependsOn:
      - job: verify
        condition:
          type: succeeded
    steps:
      - name: create-record
        description: Create the host's A record via the Cloudflare API
        guard: >-
          ${{ inputs.publish_dns == false ||
              data.latest("host-dns", "main").attributes.records.size() > 0 }}
        task:
          type: model_method
          modelType: "@webframp/cloudflare/dns"
          modelName: host-dns
          methodName: create
          globalArgs:
            zoneId: ${{ inputs.cloudflare_zone_id }}
            apiToken: ${{ vault.get("server-stack", inputs.cloudflare_token_key) }}
          inputs:
            type: A
            name: ${{ inputs.dns_record_name }}
            content: >-
              ${{ inputs.dns_record_target == "mesh"
                ? inputs.mesh_node.address.split("/")[0]
                : data.latest(inputs.server_model, inputs.hostname).attributes.public_ipv4 }}
            ttl: ${{ inputs.dns_ttl }}
            proxied: false
            comment: ${{ "managed-by=provision-server-host host=" + inputs.hostname }}
      - name: verify-record
        description: Re-list the record and check it points at the host
        guard: ${{ inputs.publish_dns == false }}
        dependsOn:
          - step: create-record
            condition:
              type: or
              conditions:
                - type: succeeded
                - type: skipped
        task:
          type: model_method
          modelType: "@webframp/cloudflare/dns"
          modelName: host-dns
          methodName: list
          globalArgs:
            zoneId: ${{ inputs.cloudflare_zone_id }}
            apiToken: ${{ vault.get("server-stack", inputs.cloudflare_token_key) }}
          inputs:
            type: A
            name: ${{ inputs.dns_record_name }}
      - name: check-record
        description: Check the record points at the host and carries the marker
        guard: ${{ inputs.publish_dns == false }}
        dependsOn:
          - step: verify-record
            condition:
              type: succeeded
        task:
          type: assert
          expr: >-
            data.latest("host-dns", "main").attributes.records.size() == 1 &&
            data.latest("host-dns", "main").attributes.records[0].content ==
            (inputs.dns_record_target == "mesh"
              ? inputs.mesh_node.address.split("/")[0]
              : data.latest(inputs.server_model, inputs.hostname).attributes.public_ipv4) &&
            data.latest("host-dns", "main").attributes.records[0].comment != null &&
            data.latest("host-dns", "main").attributes.records[0].comment.contains(
              "managed-by=provision-server-host host=" + inputs.hostname)
          message: The A record does not point at the host as expected
          severity: high
