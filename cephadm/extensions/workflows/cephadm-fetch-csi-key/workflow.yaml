id: bbad3f12-fbc8-447c-9414-dc06f8384772
name: "@randybias/cephadm-fetch-csi-key"
description: Read one client entity's key into a vaulted record
version: 1
inputs:
  properties:
    host:
      type: string
      description: Admin host, hostname or IPv4
    port:
      type: integer
      description: SSH port on the admin host
    sshUser:
      type: string
      description: SSH login user on the admin host
    keyPath:
      type: string
      default: ""
      description: Absolute local path to a private key; empty uses the runner default
    host_key_policy:
      type: string
      enum: ["strict", "insecure_tofu"]
      description: Host-key policy; strict requires host_keys
    host_keys:
      type: array
      items:
        type: string
      default: []
      description: ssh-keyscan host keys, each naming its host; required for strict
    userName:
      type: string
      description: Bare client entity name, without the client. prefix
  required:
    - host
    - port
    - sshUser
    - host_key_policy
    - userName
jobs:
  - name: fetch
    description: Read one client key into the sensitive record
    steps:
      - name: fetch-csi-key
        description: Read the client entity's key via ceph into a vaulted record
        task:
          type: model_method
          modelIdOrName: cephadm
          methodName: cephFetchCsiKey
          inputs:
            host: ${{ inputs.host }}
            port: ${{ inputs.port }}
            sshUser: ${{ inputs.sshUser }}
            keyPath: '${{ inputs.keyPath == "" ? dyn(null) : dyn(inputs.keyPath) }}'
            host_key_policy: ${{ inputs.host_key_policy }}

            host_keys: ${{ inputs.host_keys }}
            userName: ${{ inputs.userName }}
