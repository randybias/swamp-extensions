id: 18a0a08f-2024-47cb-b143-72c880ac0de3
name: "@randybias/cephadm-verify-mon-quorum"
description: Check that the mon count matches and every mon is in quorum
version: 1
inputs:
  properties:
    host:
      type: string
      description: Admin host, hostname or IPv4
    port:
      type: integer
      description: SSH port on the admin host
    sshUser:
      type: string
      description: SSH login user on the admin host
    keyPath:
      type: string
      default: ""
      description: Absolute local path to a private key; empty uses the runner default
    strictHostKeyChecking:
      type: string
      enum: ["yes", "no"]
      description: Host-key policy, yes strict or no explicitly insecure
    expectedMonCount:
      type: integer
      description: Expected number of mons in the monmap
  required:
    - host
    - port
    - sshUser
    - strictHostKeyChecking
    - expectedMonCount
jobs:
  - name: verify
    description: Read mon quorum state and halt on a failed verdict
    steps:
      - name: verify-mon-quorum
        description: Check the mon count and quorum via ceph, single-shot
        task:
          type: model_method
          modelIdOrName: cephadm
          methodName: cephVerifyMonQuorum
          inputs:
            host: ${{ inputs.host }}
            port: ${{ inputs.port }}
            sshUser: ${{ inputs.sshUser }}
            keyPath: '${{ inputs.keyPath == "" ? dyn(null) : dyn(inputs.keyPath) }}'
            strictHostKeyChecking: ${{ inputs.strictHostKeyChecking }}
            expectedMonCount: ${{ inputs.expectedMonCount }}
